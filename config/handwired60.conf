# Nom du clavier
CONFIG_ZMK_KEYBOARD_NAME="Alice"

# Passage en mode inactif après 180 secondes
CONFIG_ZMK_IDLE_TIMEOUT=180000

# Activer la veille profonde
CONFIG_ZMK_SLEEP=y

# Veille profonde après 30 minutes d'inactivité
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Compatibilite Bluetooth avec Linux / Omarchy
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y